name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Android runtime Robolectric 4.14.1 uses for @Config(sdk = [34]).
      ROBOLECTRIC_ANDROID_ALL: 14-robolectric-10818077-i7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Robolectric (the Compose UI tests) needs a ~150 MB Android runtime from Maven Central. It downloads
      # it on first use without retrying, and on GitHub's runners that download sometimes fails. Keep a
      # cached copy, and fetch it beforehand with retries and a checksum check when the cache is empty.
      # When the Robolectric version or the tests' @Config(sdk) changes, update ROBOLECTRIC_ANDROID_ALL.
      - name: Cache Robolectric's Android runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-${{ env.ROBOLECTRIC_ANDROID_ALL }}

      - name: Download Robolectric's Android runtime (with retries)
        run: |
          v="$ROBOLECTRIC_ANDROID_ALL"
          dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$v"
          url="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$v/android-all-instrumented-$v"
          mkdir -p "$dir"
          for ext in pom jar; do
            file="$dir/android-all-instrumented-$v.$ext"
            if [ ! -s "$file" ] || ! echo "$(cat "$file.sha512" 2>/dev/null)  $file" | sha512sum -c --status -; then
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 -o "$file.sha512" "$url.$ext.sha512"
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 -o "$file" "$url.$ext"
            fi
            echo "$(cat "$file.sha512")  $file" | sha512sum -c -
          done

      - name: Assemble debug & run unit tests (incl. Robolectric Compose UI tests)
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      # The optimized (R8-shrunk) build that releases use. Unsigned here: the keystore never leaves the maintainer's PC.
      - name: Assemble release (R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spotineil-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  device-tests:
    name: Smoke tests on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Starts the app, walks Home / Search / Your Library, and plays a test tone through the real player.
      - name: Run smoke tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
